<!doctype html>
<html lang="en">
<head>

<style>
:root{color-scheme:light;--bg:#fff;--panel:#fff;--line:#e5e9ed;--ink:#16191d;--muted:#535d67;--flow:#0078d4;--risk:#596c7d;--wash:#f5f8fb;--font:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}button{font:inherit}p{margin:0}main,footer{max-width:1520px;margin:auto;padding:24px 32px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:12px}h1{font-size:32px;font-weight:600;line-height:1.15;letter-spacing:-.025em;margin:0}.header-tools{display:flex;align-items:center;gap:24px}.badge{font-size:12px;color:var(--muted);white-space:nowrap}.source-action{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:9px 15px;cursor:pointer;white-space:nowrap}.source-action:hover{background:#30363c}.source-action:active{transform:translateY(1px)}
.hero{display:grid;grid-template-columns:205px minmax(0,1fr);gap:24px;align-items:center}.legend{font-size:13px;color:var(--muted)}.legend p{margin:12px 0}.loop-title{font-size:16px;font-weight:600;color:var(--ink);margin:0 0 20px;line-height:1.3}.legend .explanation{font-size:13px;line-height:1.6;max-width:205px}.swatch{display:inline-block;width:22px;height:2px;background:var(--flow);vertical-align:middle;margin-right:8px}.swatch.red{height:0;background:none;border-top:2px dashed var(--risk)}
.loop{position:relative;width:100%;height:440px;max-width:1110px;margin:auto}.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.node{position:absolute;width:26%;min-height:88px;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;z-index:1;transition:border-color .15s}.node:hover,.node:focus-visible,.node:focus-within{border-color:var(--flow);outline:none}.node h3{font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.015em;margin:0 0 4px}.node p{font-size:13px;color:var(--muted)}.node .metric{font-size:13px;line-height:1.7}.metric{cursor:pointer;outline-offset:3px;text-decoration:underline dotted #b0bfcb;text-underline-offset:4px}.metric strong{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}.node .metric+.metric:before{content:' · ';color:var(--muted)}.center{position:absolute;left:50%;top:50%;width:31%;transform:translate(-50%,-50%);text-align:center}.center .claim{font-size:24px;font-weight:600;line-height:1.2;letter-spacing:-.025em;margin:0 0 14px}.center p{font-size:13px;line-height:1.5;color:var(--muted)}.center .claim{color:var(--ink)}.center .risk-caption{font-size:12px;color:var(--risk);margin-top:12px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:32px;padding:24px 0 18px}.section-head h2{font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.02em;margin:0}.section-head p{font-size:13px;color:var(--muted);max-width:500px}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;align-items:start;background:var(--wash);border-radius:6px;padding:18px 0}.card{padding:0 16px;min-width:0;background:none;border:0}.card h3{font-size:18px;font-weight:600;line-height:1.3;letter-spacing:-.02em;margin:0 0 4px}.stance{font-size:13px;color:var(--muted);min-height:36px}.circuit{display:block;width:100%;height:25px;margin:8px 0}.route{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:14px}.card .metric{display:block;font-size:13px;line-height:1.4;margin:12px 0 0;min-height:94px;color:var(--muted)}.card .metric strong{display:block;font-size:26px;line-height:1.3;letter-spacing:-.04em;margin-bottom:3px}.details{font-size:13px;color:var(--muted);padding-top:8px}.details summary{cursor:pointer;min-height:36px;display:flex;align-items:center;gap:6px;color:var(--ink)}.details summary:after{content:'+';margin-left:auto}.details[open] summary:after{content:'−'}.details .metric{min-height:0;margin:10px 0}.details .metric strong{font-size:16px}.details p{margin-top:10px}
footer{padding-top:0;padding-bottom:28px}.footer-top{padding-top:12px;display:flex;justify-content:space-between;gap:32px}.footer-top p{font-size:13px;color:var(--muted);max-width:650px}footer details{margin-top:12px;color:var(--muted);font-size:12px}footer summary{cursor:pointer;min-height:36px;display:flex;align-items:center;color:var(--ink);width:fit-content;gap:10px}footer summary:before{content:'+'}footer details[open]>summary:before{content:'−'}footer details>p{max-width:950px;margin-top:8px}.sources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;list-style:none;padding:14px 0}.sources li{min-width:0;line-height:1.6}.sources strong{color:var(--ink);font-weight:600}.sources a{display:inline-flex;align-items:center;min-height:32px}a{color:#0067b8;text-underline-offset:3px}.tooltip{position:fixed;z-index:20;max-width:320px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:14px;font:12px/1.6 var(--font);box-shadow:0 8px 24px #182b401a}.tooltip[hidden]{display:none}.loading{color:var(--muted)}:focus-visible{outline:2px solid var(--flow);outline-offset:4px}::selection{background:#dcefff}
/* At 1440px: 1376px canvas = 205px legend + 24px gap + 1147px flow;
   regional columns share the same outer edges: 6 × (1376 / 6). */
@media(min-width:1500px){.loop{height:450px}}
@media(max-width:1200px) and (min-width:901px){.hero{grid-template-columns:170px minmax(0,1fr);gap:16px}.node{width:29%;padding:10px}.node p,.node .metric{font-size:11px}.node h3{font-size:14px}.node .metric strong{font-size:12px}.loop{height:470px}.center .claim{font-size:20px}.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 0}.card .metric{min-height:70px}}
@media(max-width:900px){main,footer{padding:22px 24px}header{align-items:flex-start}h1{font-size:28px;max-width:400px}.header-tools{flex-direction:column;align-items:flex-end;gap:12px}.hero{display:flex;flex-direction:column;align-items:stretch;gap:0}.legend{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:16px 0}.legend .loop-title{width:100%;margin:0}.legend p{margin:0}.legend .explanation{display:none}.loop{height:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0}.wires{display:none}.node{position:relative;left:auto!important;top:auto!important;transform:none;width:auto;min-height:0;background:var(--wash);padding:16px;border:0}.node h3{font-size:16px}.node .metric{font-size:13px}.center{position:static;transform:none;width:auto;grid-column:1/-1;text-align:left;padding:16px 0 0}.center .claim{font-size:22px;max-width:620px}.center .risk-caption{margin-top:8px}.section-head{align-items:flex-start;padding-top:32px}.section-head h2{font-size:22px;max-width:260px}.section-head p{max-width:360px}.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 0}.card .metric{min-height:80px}.sources{grid-template-columns:repeat(2,minmax(0,1fr))}.footer-top{display:block}.footer-top p+p{margin-top:10px}}
@media(max-width:600px){main,footer{padding:20px 16px}header{display:block}h1{font-size:28px}.header-tools{flex-direction:row;align-items:center;justify-content:space-between;margin-top:14px;gap:12px}.badge{font-size:11px;white-space:normal;max-width:200px}.source-action{font-size:12px;min-height:44px;padding:8px 12px}.legend{gap:12px 20px;padding:20px 0}.legend .loop-title{font-size:16px}.loop{display:flex;flex-direction:column;gap:20px}.node{padding:16px;flex-shrink:0}.node:not(:nth-last-child(2)):after{content:'↓';position:absolute;bottom:-22px;left:50%;color:var(--flow);font-size:18px;line-height:20px}.node h3{font-size:16px}.node p{font-size:13px}.node .metric{font-size:14px;line-height:1.7}.node .metric strong{font-size:14px}.center{padding:20px 0 0}.center .claim{font-size:22px}.section-head{display:block;padding:28px 0 18px}.section-head h2{max-width:none;font-size:22px}.section-head p{margin-top:10px}.cards{display:flex;flex-direction:column;gap:0;padding:0 16px}.card{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px;width:100%;padding:20px 0}.card+.card{border-top:1px solid var(--line)}.card h3{grid-column:1}.stance{grid-column:1;min-height:0}.circuit{grid-column:2;grid-row:1/3;align-self:center;margin:0}.route{grid-column:1/-1;font-size:12px;margin:12px 0 0}.card .metric{font-size:12px;min-height:0;align-self:start;margin-top:12px}.card .metric strong{font-size:26px}.details{grid-column:1/-1}.details summary{min-height:44px}.sources{grid-template-columns:1fr}footer{padding-top:0}footer summary{min-height:44px}.tooltip{max-width:calc(100vw - 32px)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body><main id="board" aria-busy="true"><p class="loading" role="status">Loading the capital-flow snapshot…</p></main><footer id="footer"></footer><div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<script>
'use strict';
const board=document.getElementById('board'),footer=document.getElementById('footer'),tip=document.getElementById('tooltip');
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
const svgNS='http://www.w3.org/2000/svg';
function svg(tag,attrs={}){const n=document.createElementNS(svgNS,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);return n;}
let hideTimer;
function hideTip(){tip.hidden=true;document.querySelectorAll('[aria-describedby="tooltip"]').forEach(n=>n.removeAttribute('aria-describedby'));}
function showTip(event,m){clearTimeout(hideTimer);hideTip();tip.replaceChildren(el('strong','',m.label),el('div','',`${m.value} · ${m.source_name} · ${m.date}`));if(m.source_url){const a=el('a','','View source ↗');a.href=m.source_url;a.target='_blank';a.rel='noopener noreferrer';tip.append(a);}else tip.append(el('div','','Source URL pending — supplied figure.'));event.currentTarget.setAttribute('aria-describedby','tooltip');tip.hidden=false;const r=event.currentTarget.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=Math.max(8,Math.min(r.bottom+8,innerHeight-tip.offsetHeight-8))+'px';}
function metric(m){const n=el('span','metric');n.tabIndex=0;n.setAttribute('role','button');n.addEventListener('click',e=>showTip(e,m));n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showTip(e,m);}});n.setAttribute('aria-label',`${m.value}: ${m.label}. Source: ${m.source_name}, ${m.date}. ${m.source_url?'':'Source URL pending.'}`);n.append(el('strong','',m.value),document.createTextNode(' '+m.label));n.addEventListener('mouseenter',e=>showTip(e,m));n.addEventListener('focus',e=>showTip(e,m));n.addEventListener('mouseleave',()=>{hideTimer=setTimeout(hideTip,200)});n.addEventListener('blur',()=>{hideTimer=setTimeout(()=>{if(!tip.contains(document.activeElement))hideTip()},200)});return n;}
tip.addEventListener('mouseenter',()=>clearTimeout(hideTimer));tip.addEventListener('mouseleave',hideTip);document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});window.addEventListener('scroll',hideTip,{passive:true});
function circuit(i){const s=svg('svg',{viewBox:'0 0 180 24',class:'circuit','aria-hidden':'true'});s.append(svg('path',{d:'M4 12H176',stroke:'#c9dcea','stroke-width':1}));const paths=['M4 12H45l8 -5 8 10 8 -10 8 10 8 -5H176','M4 12H176','M4 12H65m22 0H176','M4 12H48m65 0H176','M4 12H76m16 0H176','M4 12H176'];s.append(svg('path',{d:paths[i],stroke:'var(--flow)','stroke-width':i===1||i===5?3:2,fill:'none'}));for(const x of [4,176])s.append(svg('circle',{cx:x,cy:12,r:3,fill:'var(--flow)'}));return s;}
function render(d){document.title=d.title;board.replaceChildren();const header=el('header'),heading=el('div');heading.append(el('h1','',d.title));const tools=el('div','header-tools'),sourceAction=el('button','source-action','Sources');sourceAction.type='button';sourceAction.addEventListener('click',()=>{const target=document.getElementById('sources');target.open=true;target.scrollIntoView({block:'start'});target.querySelector('summary').focus({preventScroll:true});});tools.append(el('span','badge',d.badge),sourceAction);header.append(heading,tools);board.append(header);const hero=el('section','hero');hero.setAttribute('aria-label',d.loop_heading);const legend=el('aside','legend');legend.append(el('h2','loop-title',d.loop_heading));for(const [label,red]of [[d.capital_label,false],[d.risk_label,true]]){const p=el('p');p.append(el('span','swatch'+(red?' red':'')),document.createTextNode(label));legend.append(p)}legend.append(el('p','explanation',d.risk_detail),el('p','explanation',d.capture_note),el('p','explanation',d.cost_note));const loop=el('div','loop'),wires=svg('svg',{viewBox:'0 0 1000 510',preserveAspectRatio:'none',class:'wires',role:'img','aria-label':'Clockwise arrows show capital flow through the six nodes. The inner counter-clockwise arrow shows risk returning to households.'});const defs=svg('defs');for(const [id,color]of [['capital','var(--flow)'],['risk','var(--risk)']]){const marker=svg('marker',{id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M0 0L10 5L0 10Z',fill:color}));defs.append(marker)}wires.append(defs);for(let i=0;i<6;i++){const a=(-90+i*60)*Math.PI/180,b=(-90+(i+1)*60)*Math.PI/180;const x=a=>500+350*Math.cos(a),y=a=>255+192*Math.sin(a);const start=a,end=b,mid=(a+b)/2;wires.append(svg('path',{d:`M${x(start)} ${y(start)} A350 192 0 0 1 ${x(mid)} ${y(mid)} A350 192 0 0 1 ${x(end)} ${y(end)}`,stroke:'var(--flow)','stroke-width':1.5,fill:'none','marker-mid':'url(#capital)'}))}wires.append(svg('path',{d:'M305 255 A195 130 0 0 0 500 385 A195 130 0 0 0 695 255 A195 130 0 0 0 500 125',fill:'none',stroke:'var(--risk)','stroke-width':1.4,'stroke-dasharray':'4 5','marker-end':'url(#risk)'}));loop.append(wires);d.nodes.forEach((n,i)=>{const a=(-90+i*60)*Math.PI/180,card=el('article','node');card.tabIndex=0;card.setAttribute('aria-label',n.title+'. '+n.subtitle);card.style.left=(50+35*Math.cos(a))+'%';card.style.top=(50+37.65*Math.sin(a))+'%';card.append(el('h3','',n.title),el('p','',n.subtitle));const stats=el('div');n.metrics.forEach(m=>stats.append(metric(m)));card.append(stats);loop.append(card)});const center=el('div','center');center.append(el('p','claim',d.center),el('p','',d.center_note),el('p','risk-caption',d.risk_detail));loop.append(center);hero.append(legend,loop);board.append(hero);const regionSection=el('section'),sh=el('div','section-head');sh.append(el('h2','',d.regions_heading),el('p','',d.regions_note));regionSection.append(sh);const cards=el('div','cards');d.regions.forEach((r,i)=>{const c=el('article','card');c.append(el('h3','',r.name),el('p','stance',r.stance),circuit(i),el('p','route',r.route));r.metrics.forEach(m=>c.append(metric(m)));if(r.details.length||r.note){const detail=el('details','details');detail.append(el('summary','','Trace the route'));r.details.forEach(m=>detail.append(metric(m)));if(r.note)detail.append(el('p','',r.note));c.append(detail)}cards.append(c)});regionSection.append(cards);board.append(regionSection);footer.replaceChildren();const ft=el('div','footer-top');ft.append(el('p','',d.disclaimer),el('p','',d.timing_note));footer.append(ft);const evidence=el('details');evidence.append(el('summary','','Evidence & interpretation'),el('p','',d.evidence_note));footer.append(evidence);const sources=el('details'),list=el('ul','sources');sources.id='sources';sources.append(el('summary','','Sources & snapshot dates'));const all=[...d.nodes.flatMap(n=>n.metrics),...d.regions.flatMap(r=>[...r.metrics,...r.details])];for(const m of all){const li=el('li');li.append(el('strong','',m.value+' — '+m.label),el('div','',m.source_name+' · '+m.date));if(m.source_url){const a=el('a','','Source ↗');a.href=m.source_url;a.target='_blank';a.rel='noopener noreferrer';li.append(a)}else li.append(el('span','','Source URL pending'));list.append(li)}sources.append(list);footer.append(sources);board.setAttribute('aria-busy','false');}
fetch('./data/snapshot.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('Snapshot request failed');return r.json()}).then(render).catch(()=>{board.replaceChildren(el('p','','The snapshot could not be loaded. Serve this folder over HTTP or open it on GitHub Pages, then reload.'));board.setAttribute('aria-busy','false');board.setAttribute('role','alert')});
</script></body></html>
