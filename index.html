<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI economy viewer board</title><link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;--bg:#101310;--panel:#181c18;--line:#353b31;--ink:#ecebdf;--muted:#a5ad9d;--amber:#edbc64;--red:#ed8074}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}main,footer{max-width:1500px;margin:auto;padding:24px 40px}header{display:flex;justify-content:space-between;gap:24px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.eyebrow,.section-label,.badge,.route{font:10px/1.5 ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}h1{font:clamp(32px,4vw,56px)/1.05 Georgia,serif;font-weight:400;margin:5px 0 9px}p{margin:0}.intro{color:var(--muted)}.badge{border:1px solid var(--line);padding:9px 12px;border-radius:30px;white-space:nowrap;color:var(--amber)}.hero{position:relative;display:grid;grid-template-columns:210px 1fr;align-items:center;gap:20px}.legend{font-size:12px;color:var(--muted)}.legend p{margin:12px 0}.swatch{display:inline-block;width:22px;height:2px;vertical-align:middle;margin-right:8px;background:var(--amber)}.swatch.red{background:var(--red)}.legend strong{color:var(--ink);font-weight:500}.loop{position:relative;width:100%;height:440px;max-width:1000px;margin:auto}.wires{width:100%;height:100%;position:absolute;inset:0;overflow:visible}.node{position:absolute;width:25%;min-height:100px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;transform:translate(-50%,-50%);z-index:1}.node:hover,.node:focus{border-color:var(--amber);outline:none;box-shadow:0 0 0 2px #edbc6419}.node h3{margin:0 0 3px;font:18px Georgia,serif}.node p{font-size:10px;color:var(--muted)}.node .metric{display:inline;line-height:1.8;font-size:10px}.metric strong{font:500 12px ui-monospace,monospace;color:var(--amber)}.node .metric+.metric:before{content:' · ';color:var(--muted)}.metric{cursor:help;border-bottom:1px dotted #657059;outline-offset:4px}.center{position:absolute;left:50%;top:50%;width:32%;transform:translate(-50%,-50%);text-align:center}.center h2{font:clamp(19px,2.1vw,29px)/1.18 Georgia,serif;font-weight:400;margin:0 0 12px}.center p{font-size:10px;color:var(--muted)}.center .risk-caption{margin-top:16px;color:var(--red);font:10px/1.5 ui-monospace,monospace}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:30px;border-top:1px solid var(--line);padding:17px 0 13px}.section-head h2{font:24px Georgia,serif;font-weight:400;margin:0}.section-head p{font-size:11px;color:var(--muted);max-width:520px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card{border:1px solid var(--line);background:var(--panel);padding:14px 12px;min-width:0}.card h3{font:22px Georgia,serif;font-weight:400;margin:0}.stance{font-size:11px;color:var(--amber);min-height:32px}.circuit{width:100%;height:25px;display:block;margin:7px 0}.card .metric{display:block;font-size:10px;margin:9px 0;color:var(--muted)}.card .metric strong{display:block;font-size:23px;letter-spacing:-.04em}.details{font-size:10px;color:var(--muted);padding-top:8px}.details summary{cursor:pointer;color:var(--ink)}.details .metric strong{font-size:14px}.route{font-size:8px;letter-spacing:.06em}.footer-top{border-top:1px solid var(--line);padding-top:18px;display:flex;gap:24px;justify-content:space-between}.footer-top p{font-size:11px;max-width:780px;color:var(--muted)}footer{padding-top:0}footer details{margin-top:14px;color:var(--muted);font-size:11px}footer summary{cursor:pointer;color:var(--ink)}.sources{columns:2;list-style:none;padding:0}.sources li{break-inside:avoid;margin-bottom:10px}a{color:var(--amber);text-underline-offset:3px}.tooltip{position:fixed;z-index:20;max-width:320px;background:#ecebdf;color:#171b15;border-radius:4px;padding:12px;font:12px/1.5 system-ui;box-shadow:0 8px 35px #0008;pointer-events:auto}.tooltip a{color:#5c3a09}.tooltip[hidden]{display:none}#error{color:var(--red);padding:25px}.loading{color:var(--muted)}:focus-visible{outline:2px solid var(--amber);outline-offset:4px}@media(min-width:1500px){.loop{height:460px}}@media(max-width:1100px){main,footer{padding-left:24px;padding-right:24px}.hero{grid-template-columns:150px 1fr}.node{width:29%;padding:10px}.node h3{font-size:16px}.cards{grid-template-columns:repeat(3,1fr)}.loop{height:460px}.center{width:30%}}@media(max-width:700px){main,footer{padding:20px}header{display:block}.badge{display:inline-block;margin-top:14px;white-space:normal}.hero{display:block}.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px}.legend .section-label,.legend .explanation{display:none}.loop{height:auto;display:flex;flex-direction:column;padding:12px 0;gap:24px}.wires{display:none}.node{position:relative;left:auto!important;top:auto!important;transform:none;width:100%;min-height:0}.node:not(:nth-last-child(2)):after{content:'↓';color:var(--amber);position:absolute;bottom:-25px;left:50%;font-size:18px}.node .metric{font-size:12px}.node .metric strong{font-size:14px}.center{position:static;transform:none;width:100%;order:2;border-left:2px solid var(--red);padding:16px;margin:8px 0}.center h2{font-size:25px}.center p{font-size:12px}.center .risk-caption{font-size:12px}.section-head{display:block}.section-head p{margin-top:8px}.cards{grid-template-columns:repeat(2,1fr)}.footer-top{display:block}.sources{columns:1}}
</style>
</head>
<body><main id="board" aria-busy="true"><p class="loading" role="status">Loading the capital-flow snapshot…</p></main><footer id="footer"></footer><div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<script>
'use strict';
const board=document.getElementById('board'),footer=document.getElementById('footer'),tip=document.getElementById('tooltip');
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
const svgNS='http://www.w3.org/2000/svg';
function svg(tag,attrs={}){const n=document.createElementNS(svgNS,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);return n;}
let hideTimer;
function hideTip(){tip.hidden=true;document.querySelectorAll('[aria-describedby="tooltip"]').forEach(n=>n.removeAttribute('aria-describedby'));}
function showTip(event,m){clearTimeout(hideTimer);hideTip();tip.replaceChildren(el('strong','',m.label),el('div','',`${m.value} · ${m.source_name} · ${m.date}`));if(m.source_url){const a=el('a','','View source ↗');a.href=m.source_url;a.target='_blank';a.rel='noopener noreferrer';tip.append(a);}else tip.append(el('div','','Source URL pending — supplied figure.'));event.currentTarget.setAttribute('aria-describedby','tooltip');tip.hidden=false;const r=event.currentTarget.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=Math.max(8,Math.min(r.bottom+8,innerHeight-tip.offsetHeight-8))+'px';}
function metric(m){const n=el('span','metric');n.tabIndex=0;n.setAttribute('aria-label',`${m.value}: ${m.label}. Source: ${m.source_name}, ${m.date}. ${m.source_url?'':'Source URL pending.'}`);n.append(el('strong','',m.value),document.createTextNode(' '+m.label));n.addEventListener('mouseenter',e=>showTip(e,m));n.addEventListener('focus',e=>showTip(e,m));n.addEventListener('mouseleave',()=>{hideTimer=setTimeout(hideTip,200)});n.addEventListener('blur',()=>{hideTimer=setTimeout(()=>{if(!tip.contains(document.activeElement))hideTip()},200)});return n;}
tip.addEventListener('mouseenter',()=>clearTimeout(hideTimer));tip.addEventListener('mouseleave',hideTip);document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});window.addEventListener('scroll',hideTip,{passive:true});
function circuit(i){const s=svg('svg',{viewBox:'0 0 180 24',class:'circuit','aria-hidden':'true'});s.append(svg('path',{d:'M4 12H176',stroke:'#424b3d','stroke-width':1}));const paths=['M4 12H45l8 -5 8 10 8 -10 8 10 8 -5H176','M4 12H176','M4 12H65m22 0H176','M4 12H48m65 0H176','M4 12H76m16 0H176','M4 12H176'];s.append(svg('path',{d:paths[i],stroke:'var(--amber)','stroke-width':i===1||i===5?3:2,fill:'none'}));for(const x of [4,176])s.append(svg('circle',{cx:x,cy:12,r:3,fill:'var(--amber)'}));return s;}
function render(d){document.title=d.title;board.replaceChildren();const header=el('header'),heading=el('div');heading.append(el('p','eyebrow',d.eyebrow),el('h1','',d.title),el('p','intro',d.intro));header.append(heading,el('span','badge',d.badge));board.append(header);const hero=el('section','hero');hero.setAttribute('aria-label',d.loop_heading);const legend=el('aside','legend');legend.append(el('p','section-label',d.loop_heading));for(const [label,red]of [[d.capital_label,false],[d.risk_label,true]]){const p=el('p');p.append(el('span','swatch'+(red?' red':'')),document.createTextNode(label));legend.append(p)}legend.append(el('p','explanation',d.risk_detail),el('p','explanation',d.capture_note),el('p','explanation',d.cost_note));const loop=el('div','loop'),wires=svg('svg',{viewBox:'0 0 1000 510',preserveAspectRatio:'none',class:'wires',role:'img','aria-label':'Clockwise arrows show capital flow through the six nodes. The inner counter-clockwise arrow shows risk returning to households.'});const defs=svg('defs');for(const [id,color]of [['capital','var(--amber)'],['risk','var(--red)']]){const marker=svg('marker',{id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M0 0L10 5L0 10Z',fill:color}));defs.append(marker)}wires.append(defs);for(let i=0;i<6;i++){const a=(-90+i*60)*Math.PI/180,b=(-90+(i+1)*60)*Math.PI/180;const x=a=>500+350*Math.cos(a),y=a=>255+192*Math.sin(a);const start=a,end=b,mid=(a+b)/2;wires.append(svg('path',{d:`M${x(start)} ${y(start)} A350 192 0 0 1 ${x(mid)} ${y(mid)} A350 192 0 0 1 ${x(end)} ${y(end)}`,stroke:'var(--amber)','stroke-width':1.5,fill:'none','marker-mid':'url(#capital)'}))}wires.append(svg('path',{d:'M305 255 A195 130 0 0 0 500 385 A195 130 0 0 0 695 255 A195 130 0 0 0 500 125',fill:'none',stroke:'var(--red)','stroke-width':1.4,'stroke-dasharray':'4 5','marker-end':'url(#risk)'}));loop.append(wires);d.nodes.forEach((n,i)=>{const a=(-90+i*60)*Math.PI/180,card=el('article','node');card.tabIndex=0;card.setAttribute('aria-label',n.title+'. '+n.subtitle);card.style.left=(50+35*Math.cos(a))+'%';card.style.top=(50+37.65*Math.sin(a))+'%';card.append(el('h3','',n.title),el('p','',n.subtitle));const stats=el('div');n.metrics.forEach(m=>stats.append(metric(m)));card.append(stats);loop.append(card)});const center=el('div','center');center.append(el('h2','',d.center),el('p','',d.center_note),el('p','risk-caption',d.risk_detail));loop.append(center);hero.append(legend,loop);board.append(hero);const regionSection=el('section'),sh=el('div','section-head');sh.append(el('h2','',d.regions_heading),el('p','',d.regions_note));regionSection.append(sh);const cards=el('div','cards');d.regions.forEach((r,i)=>{const c=el('article','card');c.append(el('h3','',r.name),el('p','stance',r.stance),circuit(i),el('p','route',r.route));r.metrics.forEach(m=>c.append(metric(m)));if(r.details.length||r.note){const detail=el('details','details');detail.append(el('summary','','Trace the route'));r.details.forEach(m=>detail.append(metric(m)));if(r.note)detail.append(el('p','',r.note));c.append(detail)}cards.append(c)});regionSection.append(cards);board.append(regionSection);footer.replaceChildren();const ft=el('div','footer-top');ft.append(el('p','',d.disclaimer),el('p','',d.timing_note));footer.append(ft);const evidence=el('details');evidence.append(el('summary','','Evidence & interpretation'),el('p','',d.evidence_note));footer.append(evidence);const sources=el('details'),list=el('ul','sources');sources.append(el('summary','','Sources & snapshot dates'));const all=[...d.nodes.flatMap(n=>n.metrics),...d.regions.flatMap(r=>[...r.metrics,...r.details])];for(const m of all){const li=el('li');li.append(el('strong','',m.value+' — '+m.label),el('div','',m.source_name+' · '+m.date));if(m.source_url){const a=el('a','','Source ↗');a.href=m.source_url;a.target='_blank';a.rel='noopener noreferrer';li.append(a)}else li.append(el('span','','Source URL pending'));list.append(li)}sources.append(list);footer.append(sources);board.setAttribute('aria-busy','false');}
fetch('./data/snapshot.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('Snapshot request failed');return r.json()}).then(render).catch(()=>{board.replaceChildren(el('p','','The snapshot could not be loaded. Serve this folder over HTTP or open it on GitHub Pages, then reload.'));board.setAttribute('aria-busy','false');board.setAttribute('role','alert')});
</script></body></html>
