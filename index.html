<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI economy viewer board</title><link rel="icon" href="data:,">
<style>
:root {
  color-scheme: light;
  --bg: #fff; --panel: #fff; --line: #dce5ec;
  --ink: #101010; --muted: #596674; --flow: #0078d4; --risk: #526c83;
  --wash: #f3f8fc;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
main, footer { max-width: 1520px; margin: auto; padding: 28px 44px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 30px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.eyebrow, .section-label, .route { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.eyebrow { color: #29343e; margin-bottom: 12px; }
h1 { font-size: clamp(34px, 4.5vw, 64px); line-height: 1.02; letter-spacing: -.055em; font-weight: 600; margin: 0 0 14px; }
p { margin: 0; }
.intro { color: var(--muted); font-size: 14px; }
.badge { background: #edf6fd; color: #125c93; font: 10px/1.5 ui-monospace, monospace; padding: 10px 14px; border: 1px solid #d5eafa; border-radius: 3px; white-space: nowrap; }
.hero { position: relative; display: grid; grid-template-columns: 190px 1fr; align-items: center; gap: 28px; }
.legend { font-size: 12px; color: var(--muted); }
.legend p { margin: 14px 0; }
.legend .section-label { color: var(--ink); margin-bottom: 20px; }
.legend .explanation { font-size: 11px; line-height: 1.6; }
.swatch { display: inline-block; width: 22px; height: 2px; vertical-align: middle; margin-right: 8px; background: var(--flow); }
.swatch.red { background: repeating-linear-gradient(to right, var(--risk) 0 4px, transparent 4px 7px); }
.loop { position: relative; width: 100%; height: 470px; max-width: 1040px; margin: auto; isolation: isolate; }
.loop:before { content: ""; position: absolute; inset: 15% 12%; z-index: -1; border-radius: 50%; background: radial-gradient(ellipse, #dfedfc 0%, #f3f9ff 45%, #fff0 72%); }
.wires { width: 100%; height: 100%; position: absolute; inset: 0; overflow: visible; }
.node { position: absolute; width: 25%; min-height: 98px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 13px 15px; transform: translate(-50%, -50%); z-index: 1; transition: border-color .15s, box-shadow .15s; }
.node:hover, .node:focus-visible { border-color: #77b8ea; box-shadow: 0 4px 20px #0078d410; outline: 2px solid #aad5f6; outline-offset: 3px; }
.node h3 { margin: 0 0 5px; font-size: 17px; font-weight: 600; letter-spacing: -.025em; }
.node p { font-size: 10px; color: var(--muted); }
.node .metric { display: inline; font-size: 10px; line-height: 1.9; }
.metric { cursor: help; border-bottom: 1px dotted #a4bbcd; outline-offset: 4px; }
.metric strong { font: 500 12px ui-monospace, SFMono-Regular, Consolas, monospace; color: #075b9c; }
.node .metric+.metric:before { content: ' · '; color: var(--muted); }
.center { position: absolute; left: 50%; top: 50%; width: 32%; transform: translate(-50%, -50%); text-align: center; }
.center h2 { font-size: clamp(19px, 2.1vw, 29px); font-weight: 600; letter-spacing: -.04em; line-height: 1.15; margin: 0 0 13px; }
.center p { font-size: 10px; color: var(--muted); }
.center .risk-caption { margin-top: 16px; color: #3e607b; font: 10px/1.5 ui-monospace, monospace; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 30px; border-top: 1px solid var(--line); padding: 20px 0 18px; }
.section-head h2 { font-size: 25px; line-height: 1.2; letter-spacing: -.035em; font-weight: 600; margin: 0; }
.section-head p { font-size: 11px; color: var(--muted); max-width: 510px; }
.cards { display: grid; grid-template-columns: repeat(6,1fr); gap: 12px; }
.card { border: 1px solid #e4edf4; border-radius: 4px; background: var(--wash); padding: 17px 14px; min-width: 0; }
.card:nth-child(2), .card:nth-child(6) { background: #ebf5fd; }
.card h3 { font-size: 21px; font-weight: 600; letter-spacing: -.035em; margin: 0 0 2px; }
.stance { font-size: 11px; color: #456581; min-height: 32px; }
.circuit { width: 100%; height: 25px; display: block; margin: 7px 0; }
.route { font-size: 8px; letter-spacing: .06em; color: #576d80; }
.card .metric { display: block; font-size: 10px; margin: 10px 0; color: var(--muted); }
.card .metric strong { display: block; color: var(--ink); font-size: 24px; letter-spacing: -.055em; line-height: 1.35; }
.details { font-size: 10px; color: var(--muted); padding-top: 8px; }
.details summary { cursor: pointer; color: #075b9c; }
.details .metric strong { font-size: 14px; }
footer { padding-top: 0; }
.footer-top { border-top: 1px solid var(--line); padding-top: 20px; display: flex; gap: 24px; justify-content: space-between; }
.footer-top p { font-size: 11px; max-width: 780px; color: var(--muted); }
footer details { margin-top: 14px; color: var(--muted); font-size: 11px; }
footer summary { cursor: pointer; color: #263b4c; }
footer details>p { padding-top: 10px; max-width: 900px; }
.sources { columns: 2; list-style: none; padding: 0; }
.sources li { break-inside: avoid; margin-bottom: 12px; }
a { color: #0067b8; text-underline-offset: 3px; }
.tooltip { position: fixed; z-index: 20; max-width: 320px; background: #fff; color: var(--ink); border: 1px solid #d1e2ef; border-radius: 5px; padding: 14px; font-size: 12px; line-height: 1.6; box-shadow: 0 8px 30px #1b426222; pointer-events: auto; }
.tooltip a { color: #0067b8; }
.tooltip[hidden] { display: none; }
#error { color: #8a3131; padding: 25px; }
.loading { color: var(--muted); }
:focus-visible { outline: 2px solid #0078d4; outline-offset: 4px; }
@media (min-width: 1500px) { .loop { height: 480px; } }
@media (max-width: 1100px) {
  main, footer { padding-left: 26px; padding-right: 26px; }
  header { gap: 20px; }
  .hero { grid-template-columns: 145px 1fr; gap: 20px; }
  .node { width: 29%; padding: 11px; }
  .node h3 { font-size: 15px; }
  .cards { grid-template-columns: repeat(3,1fr); }
  .loop { height: 480px; }
  .center { width: 30%; }
}
@media (max-width: 700px) {
  main, footer { padding: 22px 20px; }
  header { display: block; }
  h1 { font-size: 42px; }
  .badge { display: inline-block; margin-top: 18px; white-space: normal; }
  .hero { display: block; }
  .legend { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; }
  .legend .section-label, .legend .explanation { display: none; }
  .loop { height: auto; display: flex; flex-direction: column; padding: 12px 0; gap: 24px; }
  .loop:before, .wires { display: none; }
  .node { position: relative; left: auto!important; top: auto!important; transform: none; width: 100%; min-height: 0; padding: 16px; background: #f8fbfe; }
  .node h3 { font-size: 18px; }
  .node:not(:nth-last-child(2)):after { content: '↓'; color: var(--flow); position: absolute; bottom: -25px; left: 50%; font-size: 18px; }
  .node .metric { font-size: 12px; }
  .node .metric strong { font-size: 14px; }
  .center { position: static; transform: none; width: 100%; order: 2; background: #edf6ff; border-left: 2px solid var(--flow); padding: 24px 20px; margin: 8px 0; text-align: left; }
  .center h2 { font-size: 29px; }
  .center p, .center .risk-caption { font-size: 12px; }
  .section-head { display: block; }
  .section-head p { margin-top: 10px; }
  .cards { grid-template-columns: repeat(2,1fr); }
  .footer-top { display: block; }
  .footer-top p+p { margin-top: 12px; }
  .sources { columns: 1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none!important; } }
</style>
</head>
<body><main id="board" aria-busy="true"><p class="loading" role="status">Loading the capital-flow snapshot…</p></main><footer id="footer"></footer><div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<script>
'use strict';
const board=document.getElementById('board'),footer=document.getElementById('footer'),tip=document.getElementById('tooltip');
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
const svgNS='http://www.w3.org/2000/svg';
function svg(tag,attrs={}){const n=document.createElementNS(svgNS,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);return n;}
let hideTimer;
function hideTip(){tip.hidden=true;document.querySelectorAll('[aria-describedby="tooltip"]').forEach(n=>n.removeAttribute('aria-describedby'));}
function showTip(event,m){clearTimeout(hideTimer);hideTip();tip.replaceChildren(el('strong','',m.label),el('div','',`${m.value} · ${m.source_name} · ${m.date}`));if(m.source_url){const a=el('a','','View source ↗');a.href=m.source_url;a.target='_blank';a.rel='noopener noreferrer';tip.append(a);}else tip.append(el('div','','Source URL pending — supplied figure.'));event.currentTarget.setAttribute('aria-describedby','tooltip');tip.hidden=false;const r=event.currentTarget.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=Math.max(8,Math.min(r.bottom+8,innerHeight-tip.offsetHeight-8))+'px';}
function metric(m){const n=el('span','metric');n.tabIndex=0;n.setAttribute('aria-label',`${m.value}: ${m.label}. Source: ${m.source_name}, ${m.date}. ${m.source_url?'':'Source URL pending.'}`);n.append(el('strong','',m.value),document.createTextNode(' '+m.label));n.addEventListener('mouseenter',e=>showTip(e,m));n.addEventListener('focus',e=>showTip(e,m));n.addEventListener('mouseleave',()=>{hideTimer=setTimeout(hideTip,200)});n.addEventListener('blur',()=>{hideTimer=setTimeout(()=>{if(!tip.contains(document.activeElement))hideTip()},200)});return n;}
tip.addEventListener('mouseenter',()=>clearTimeout(hideTimer));tip.addEventListener('mouseleave',hideTip);document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});window.addEventListener('scroll',hideTip,{passive:true});
function circuit(i){const s=svg('svg',{viewBox:'0 0 180 24',class:'circuit','aria-hidden':'true'});s.append(svg('path',{d:'M4 12H176',stroke:'#c9dcea','stroke-width':1}));const paths=['M4 12H45l8 -5 8 10 8 -10 8 10 8 -5H176','M4 12H176','M4 12H65m22 0H176','M4 12H48m65 0H176','M4 12H76m16 0H176','M4 12H176'];s.append(svg('path',{d:paths[i],stroke:'var(--flow)','stroke-width':i===1||i===5?3:2,fill:'none'}));for(const x of [4,176])s.append(svg('circle',{cx:x,cy:12,r:3,fill:'var(--flow)'}));return s;}
function render(d){document.title=d.title;board.replaceChildren();const header=el('header'),heading=el('div');heading.append(el('p','eyebrow',d.eyebrow),el('h1','',d.title),el('p','intro',d.intro));header.append(heading,el('span','badge',d.badge));board.append(header);const hero=el('section','hero');hero.setAttribute('aria-label',d.loop_heading);const legend=el('aside','legend');legend.append(el('p','section-label',d.loop_heading));for(const [label,red]of [[d.capital_label,false],[d.risk_label,true]]){const p=el('p');p.append(el('span','swatch'+(red?' red':'')),document.createTextNode(label));legend.append(p)}legend.append(el('p','explanation',d.risk_detail),el('p','explanation',d.capture_note),el('p','explanation',d.cost_note));const loop=el('div','loop'),wires=svg('svg',{viewBox:'0 0 1000 510',preserveAspectRatio:'none',class:'wires',role:'img','aria-label':'Clockwise arrows show capital flow through the six nodes. The inner counter-clockwise arrow shows risk returning to households.'});const defs=svg('defs');for(const [id,color]of [['capital','var(--flow)'],['risk','var(--risk)']]){const marker=svg('marker',{id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M0 0L10 5L0 10Z',fill:color}));defs.append(marker)}wires.append(defs);for(let i=0;i<6;i++){const a=(-90+i*60)*Math.PI/180,b=(-90+(i+1)*60)*Math.PI/180;const x=a=>500+350*Math.cos(a),y=a=>255+192*Math.sin(a);const start=a,end=b,mid=(a+b)/2;wires.append(svg('path',{d:`M${x(start)} ${y(start)} A350 192 0 0 1 ${x(mid)} ${y(mid)} A350 192 0 0 1 ${x(end)} ${y(end)}`,stroke:'var(--flow)','stroke-width':1.5,fill:'none','marker-mid':'url(#capital)'}))}wires.append(svg('path',{d:'M305 255 A195 130 0 0 0 500 385 A195 130 0 0 0 695 255 A195 130 0 0 0 500 125',fill:'none',stroke:'var(--risk)','stroke-width':1.4,'stroke-dasharray':'4 5','marker-end':'url(#risk)'}));loop.append(wires);d.nodes.forEach((n,i)=>{const a=(-90+i*60)*Math.PI/180,card=el('article','node');card.tabIndex=0;card.setAttribute('aria-label',n.title+'. '+n.subtitle);card.style.left=(50+35*Math.cos(a))+'%';card.style.top=(50+37.65*Math.sin(a))+'%';card.append(el('h3','',n.title),el('p','',n.subtitle));const stats=el('div');n.metrics.forEach(m=>stats.append(metric(m)));card.append(stats);loop.append(card)});const center=el('div','center');center.append(el('h2','',d.center),el('p','',d.center_note),el('p','risk-caption',d.risk_detail));loop.append(center);hero.append(legend,loop);board.append(hero);const regionSection=el('section'),sh=el('div','section-head');sh.append(el('h2','',d.regions_heading),el('p','',d.regions_note));regionSection.append(sh);const cards=el('div','cards');d.regions.forEach((r,i)=>{const c=el('article','card');c.append(el('h3','',r.name),el('p','stance',r.stance),circuit(i),el('p','route',r.route));r.metrics.forEach(m=>c.append(metric(m)));if(r.details.length||r.note){const detail=el('details','details');detail.append(el('summary','','Trace the route'));r.details.forEach(m=>detail.append(metric(m)));if(r.note)detail.append(el('p','',r.note));c.append(detail)}cards.append(c)});regionSection.append(cards);board.append(regionSection);footer.replaceChildren();const ft=el('div','footer-top');ft.append(el('p','',d.disclaimer),el('p','',d.timing_note));footer.append(ft);const evidence=el('details');evidence.append(el('summary','','Evidence & interpretation'),el('p','',d.evidence_note));footer.append(evidence);const sources=el('details'),list=el('ul','sources');sources.append(el('summary','','Sources & snapshot dates'));const all=[...d.nodes.flatMap(n=>n.metrics),...d.regions.flatMap(r=>[...r.metrics,...r.details])];for(const m of all){const li=el('li');li.append(el('strong','',m.value+' — '+m.label),el('div','',m.source_name+' · '+m.date));if(m.source_url){const a=el('a','','Source ↗');a.href=m.source_url;a.target='_blank';a.rel='noopener noreferrer';li.append(a)}else li.append(el('span','','Source URL pending'));list.append(li)}sources.append(list);footer.append(sources);board.setAttribute('aria-busy','false');}
fetch('./data/snapshot.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('Snapshot request failed');return r.json()}).then(render).catch(()=>{board.replaceChildren(el('p','','The snapshot could not be loaded. Serve this folder over HTTP or open it on GitHub Pages, then reload.'));board.setAttribute('aria-busy','false');board.setAttribute('role','alert')});
</script></body></html>
