el('details');evidence.append(el('summary','','Evidence & interpretation'),el('p','',d.evidence_note));footer.append(evidence);const sources=el('details'),list=el('ul','sources');sources.id='sources';sources.append(el('summary','','Sources & snapshot dates'));const all=[...d.nodes.flatMap(n=>n.metrics),...d.regions.flatMap(r=>[...r.metrics,...r.details])];for(const m of all){const li=el('li');li.append(el('strong','',m.value+' — '+m.label),el('div','',m.source_name+' · '+m.date));if(m.source_url){const a=el('a','','Source ↗');a.href=m.source_url;a.target='_blank';a.rel='noopener noreferrer';li.append(a)}else li.append(el('span','','Source URL pending'));list.append(li)}sources.append(sourceControls(e,list),list);footer.append(sources);board.setAttribute('aria-busy','false');}
function appendFlowReader(d,e){
  const section=el('section','flow-reader');section.setAttribute('aria-labelledby','flow-reader-heading');
  const heading=el('h2','',e.flow_heading);heading.id='flow-reader-heading';

function selectStage(i,d,e,scroll=false){

  document.querySelectorAll('.node').forEach((node,j)=>{node.classList.toggle('is-selected',i===j);node.querySelector('.node-select').setAttribute('aria-pressed',String(i===j));});
  detail.replaceChildren(el('h3','',entry.heading),el('p','flow-description',entry.description));
  const facts=el('dl','flow-facts');entry.items.forEach((text,j)=>{const pair=el('div');pair.append(el('dt','',e.flow_labels[j]),el('dd','',text));facts.append(pair);});detail.append(facts);if(scroll)detail.parentElement.scrollIntoView({block:'start'});

function sourceControls(e,list){
  const wrap=el('div'),controls=el('div','source-controls'),empty=el('p','source-empty',e.source_empty);empty.hidden=true;empty.setAttribute('role','status');
  e.source_filters.forEach((label,i)=>{const button=el('button','source-filter',label);button.type='button';button.setAttribute('aria-pressed',String(i===0));button.addEventListener('click',()=>{controls.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));let visible=false;for(const li of list.children){const linked=!!li.querySelector('a');li.hidden=(i===1&&!linked)||(i===2&&linked);if(!li.hidden)visible=true;}empty.hidden=visible;});controls.append(button);});wrap.append(controls,empty);return wrap;

function render(d,e,t){
  renderCapitalCase(d,e);document.title=t.title;
  const header=board.querySelector('header');header.querySelector('h1').textContent=t.title;header.querySelector('.badge').textContent=t.status;
  const oldHero=board.querySelector('.hero'),oldRegions=oldHero.nextElementSibling,oldReader=board.querySelector('.flow-reader');
  board.querySelectorAll('.mechanism,.reading').forEach(n=>n.remove());
  const nav=el('nav','theory-nav');nav.setAttribute('aria-label','Page sections');['mechanism','model','capture','evidence','capital-case'].forEach((id,i)=>{const a=el('a','',t.nav[i]);a.href='#'+id;nav.append(a);});board.append(nav);
  const intro=el('p','theory-intro',t.proposition);board.append(intro);

  const feedback=el('div','feedbacks');t.feedbacks.forEach(item=>{const a=el('article');a.append(el('h3','',item.title),el('p','',item.body));feedback.append(a);});network.append(feedback,el('p','section-description',t.feedback_note));board.append(network);

  const evidence=el('section','theory-section');evidence.id='evidence';evidence.append(el('h2','',t.tests_heading));const tests=el('div','theory-tests');t.tests.forEach(item=>{const article=el('article');article.append(el('h3','',item.title),el('p','',item.hypothesis),el('p','test-detail',item.test),el('p','test-detail',item.weakens));tests.append(article);});evidence.append(tests);const paper=el('a','paper-link',t.paper_label);paper.href='https://github.com/neekitalian/ai-bottleneck-theory/blob/main/ai-bottleneck-theory-v01.md';evidence.append(paper);board.append(evidence);
  const cases=el('section','theory-section capital-case');cases.id='capital-case';cases.append(el('h2','',t.case_heading),el('p','section-description',t.case_intro));const disclosure=el('details','capital-disclosure');disclosure.append(el('summary','',t.case_summary),oldHero,oldRegions,oldReader);cases.append(disclosure);board.append(cases);

function appendModel(t){
  const section=el('section','theory-section model-section');section.id='model';section.append(el('h2','',t.model_heading),el('p','section-description',t.model_intro));
  const formulas=el('div','formulas');formulas.append(el('p','',t.formula_q),el('p','',t.formula_profit));section.append(formulas);
  const presets=el('div','presets'),layout=el('div','model-layout'),controls=el('div','model-controls'),results=el('div','model-results');results.setAttribute('aria-live','polite');results.setAttribute('aria-atomic','true');const inputs={};
  const money=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(n);
  function update(){const v=Object.fromEntries(Object.entries(inputs).map(([k,input])=>[k,Number(input.value)]));Object.entries(inputs).forEach(([k,input])=>input.previousElementSibling.querySelector('output').textContent=money(v[k]));const q=Math.min(v.D,v.K,v.T),binding=['D','K','T'].filter(k=>v[k]===q).join(' + ');results.replaceChildren();[binding,money(q),money(v.m*q-t.fixed.value)].forEach((value,i)=>{const box=el('div');box.append(el('p','result-label',t.output_labels[i]),el('p','result-value',value));if(i>0)box.append(el('p','result-unit',i===1?t.capacity_note:t.profit_note));results.append(box);});if(v.m<0)results.append(el('p','negative-margin',t.margin_warning));presets.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(Object.entries(t.presets[i].values).every(([k,n])=>v[k]===n))));}

  t.presets.forEach(p=>{const button=el('button','source-filter',p.label);button.type='button';button.addEventListener('click',()=>{Object.entries(p.values).forEach(([k,value])=>inputs[k].value=value);update();});presets.append(button);});layout.append(controls,results);section.append(presets,layout);
  const fixed=el('p','model-assumptions');fixed.append(metric(t.price),document.createTextNode(' · '),metric(t.fixed));section.append(fixed,el('p','section-description',t.assumptions),el('p','section-description',t.model_limit));board.append(section);update();
}

async function loadBoard(){
  board.setAttribute('aria-busy','true');
  try{const files=await Promise.all(['./data/snapshot.json','./data/explainer.json','./data/theory.json'].map(async url=>{const response=await fetch(url,{cache:'no-cache'});if(!response.ok)throw new Error('Data request failed');return response.json();}));render(...files);}
  catch{board.replaceChildren();const error=el('div','load-error');error.setAttribute('role','alert');const retry=el('button','source-action','Try again');retry.type='button';retry.addEventListener('click',loadBoard);error.append(el('p','','The board could not load its data. Check your connection and try again.'),retry);board.append(error);board.setAttribute('aria-busy','false');}
}
loadBoard();
